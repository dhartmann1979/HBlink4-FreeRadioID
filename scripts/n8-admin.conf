# HBlink4-FreeRadioID – Projektdaten für scripts/n8-admin.sh (Update, Berechtigungen, sudo, Dienste)
N8_ID=hblink4
N8_NAME="HBlink4-FreeRadioID"
N8_MAIN_UNIT=hblink4-dash.service
N8_WEB_UNIT=hblink4-dash.service
# Dienste in der Übersicht (Adminbereich → System → Dienste): Unit|Bezeichnung|erlaubte Aktionen (leer = alle)
N8_UNITS=("hblink4.service|DMR-Server (HBlink4)" "hblink4-dash.service|Dashboard" "hblink4-update.path|Update-Auslöser („Update jetzt“)")
N8_RESTART_UNITS=(hblink4.service hblink4-dash.service)

n8_layout() {
    local d port https
    d="$(grep -h '^Environment=HBLINK4_DASH_DATA_DIR=' /etc/systemd/system/hblink4-dash.service 2>/dev/null | head -1 | cut -d= -f3- || true)"
    STATE_DIR="${d:-$APP/dashboard/data}"
    N8_DATA_DIRS=("$STATE_DIR")
    # schreibt der Dienst selbst: Logs, Konfiguration (Passwörter!), Daten des Dashboards
    N8_WRITABLE_IN_APP=("$APP/logs" "$APP/config" "$APP/dashboard/config.json" "$APP/dashboard/data")
    N8_SECRETS=("$APP/config/config.json $APP/dashboard/config.json|600" "$STATE_DIR/*.db $STATE_DIR/*.db-wal|600")
    read -r port https < <(python3 - "$APP/dashboard/config.json" <<'PY' 2>/dev/null || echo "8080 0"
import json, sys
try:
    c = json.load(open(sys.argv[1]))
except Exception:
    c = {}
w = c.get("web") or {}
h = c.get("https") or {}
print(int(w.get("port") or 8080), 1 if h.get("enabled") else 0)
PY
)
    # Port und HTTPS stehen nach dem ersten Start in der Datenbank (Adminbereich → HTTPS & web) – alle üblichen Adressen probieren
    N8_HEALTH_URL="http://127.0.0.1:${port:-8080}/api/version http://127.0.0.1:8080/api/version https://127.0.0.1/api/version"
}
n8_version() { tr -d '[:space:]' < "$APP/VERSION"; }
n8_post_update() {   # nach dem Vorspulen: Pakete (nur bei Änderungen), alte Reste
    local old="$1" new="$2"
    if git_ diff --name-only "$old" "$new" | grep -qE '^(requirements(-dashboard)?\.txt|pyproject\.toml)$'; then
        "$APP/venv/bin/pip" install -q -r "$APP/requirements.txt" -r "$APP/requirements-dashboard.txt" || return 1
    fi
    # bis 1.11: N8 update guard als ExecStartPre – macht jetzt n8-admin.sh
    if grep -q "n8-update-guard" /etc/systemd/system/hblink4-dash.service 2>/dev/null; then
        sed -i '/n8-update-guard/d; /N8 update guard: after an update/d; /if the dashboard does not come up three times/d' /etc/systemd/system/hblink4-dash.service
        systemctl daemon-reload || true
    fi
    rm -f /etc/sudoers.d/hblink4-update
    return 0
}
n8_sudo_extra() {   # „Update now“ (alte Versionen) und „Restart“ im Adminbereich: beide Dienste auf einmal neu starten
    local SC="$1"
    echo "$SVC_USER ALL=(root) NOPASSWD: $SC --no-block restart hblink4.service hblink4-dash.service"
}
