<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>APRS map</title>
    <link rel="icon" id="favicon" type="image/svg+xml" href="/static/n8schicht-aprs-icon.svg">
    <link rel="alternate icon" type="image/png" href="/static/n8schicht-aprs-icon-192.png">
    <link rel="apple-touch-icon" href="/static/n8schicht-aprs-icon-192.png">
    <meta name="theme-color" content="#070b17">
    <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
    <script src="/static/vendor/leaflet/leaflet.js"></script>
    <script src="/static/n8-theme.js"></script>
    <link rel="stylesheet" href="/static/n8-kit.css">
    <script src="/static/n8-kit.js"></script>
    <script src="/static/i18n-dashboard.js"></script>
    <script src="/static/n8-i18n-intl.js"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.055); --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.18); --glass-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
            --glass-blur: blur(22px) saturate(170%); --radius-lg: 22px; --radius-md: 16px; --radius-sm: 12px;
            --accent: #5ac8fa; --accent-rgb: 90, 200, 250; --accent2: #9bd8ff; --title-to: #9bd8ff;
            --text: #f5f7fb; --text-dim: rgba(235, 240, 250, 0.62); --green: #30d158; --amber: #ffd60a; --red: #ff453a;
            --logo-size: 44px; --logo-radius: 0px; --panel: rgba(13, 19, 38, 0.86); --dmr: #bf5af2;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
            color: var(--text); background: #070b17; overflow: hidden; -webkit-font-smoothing: antialiased;
        }
        #map { position: fixed; inset: 0; background: #0b1224; }
        html[data-theme-mode=light] #map { background: #e8eef6; }
        .glass {
            background: var(--panel); border: 1px solid var(--glass-border);
            -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
            box-shadow: inset 0 1px 0 var(--glass-highlight), var(--glass-shadow);
        }
        html[data-theme-mode=light] { --panel: rgba(255, 255, 255, 0.9); }

        /* ---- header (same look as the dashboard) ---- */
        header {
            position: fixed; z-index: 1000; top: 12px; left: 12px; right: 12px;
            display: flex; align-items: center; gap: 12px 16px; padding: 8px 14px; border-radius: var(--radius-lg);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; text-decoration: none; color: inherit; }
        .logo { height: var(--logo-size); width: auto; max-width: 120px; border-radius: var(--logo-radius);
                filter: drop-shadow(0 4px 12px rgba(var(--accent-rgb), 0.35)); }
        h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap;
             background: linear-gradient(90deg, var(--text) 0%, var(--title-to) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .sub { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chips { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: nowrap; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 650;
            border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text); white-space: nowrap; text-decoration: none; cursor: default;
        }
        a.chip, button.chip { cursor: pointer; font-family: inherit; }
        a.chip:hover, button.chip:hover { border-color: rgba(var(--accent-rgb), 0.6); }
        .chip b { color: var(--accent); font-variant-numeric: tabular-nums; }
        .chip.ok { background: rgba(48, 209, 88, 0.2); color: #7ef0a0; border-color: rgba(48, 209, 88, 0.45); }
        .chip.warn { background: rgba(255, 214, 10, 0.16); color: #ffe36a; border-color: rgba(255, 214, 10, 0.4); }
        .chip.off { background: rgba(255, 69, 58, 0.18); color: #ff8a80; border-color: rgba(255, 69, 58, 0.45); }
        html[data-theme-mode=light] .chip.ok { color: #15803d; } html[data-theme-mode=light] .chip.warn { color: #a16207; }
        html[data-theme-mode=light] .chip.off { color: #c0362c; }
        .chip.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0b1224; border: none; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
        /* one menu in the header, the services in a slim strip under it (same as the dashboard) */
        .menu { display: flex; gap: 4px; margin-left: auto; padding: 4px; border-radius: 999px; background: rgba(127, 127, 127, 0.1); }
        .menu .mi { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 650;
                    color: var(--text-dim); text-decoration: none; white-space: nowrap; border: 1px solid transparent; }
        .menu .mi.active { color: var(--text); background: rgba(var(--accent-rgb), 0.18); border-color: rgba(var(--accent-rgb), 0.4); }
        .menu a.mi:hover { color: var(--text); background: rgba(var(--accent-rgb), 0.12); }
        .status-strip { position: fixed; z-index: 999; top: 77px; left: 36px; right: 36px; height: 22px; display: flex; align-items: center; gap: 16px;
                        padding: 0 14px; font-size: 11.5px; font-weight: 600; color: var(--text-dim); border-radius: 0 0 14px 14px;
                        background: var(--panel); border: 1px solid var(--glass-border); border-top: 0; overflow-x: auto; scrollbar-width: none;
                        -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); white-space: nowrap; }
        .status-strip::-webkit-scrollbar { display: none; }
        .status-strip .ss { display: inline-flex; align-items: center; gap: 6px; }
        .status-strip .ss::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #ffd60a; box-shadow: 0 0 6px rgba(255,214,10,.7); }
        .status-strip .ss.ok::before { background: #30d158; box-shadow: 0 0 6px rgba(48,209,88,.8); }
        .status-strip .ss.off::before { background: #ff453a; box-shadow: 0 0 6px rgba(255,69,58,.8); }
        .status-strip .ss-sep { flex: 1 1 auto; }
        .status-strip b { color: var(--accent); }

        /* ---- side panel ---- */
        #panel {
            position: fixed; z-index: 900; top: var(--below-head, 112px); left: 12px; bottom: 12px; width: 360px;
            display: flex; flex-direction: column; border-radius: var(--radius-lg); overflow: hidden;
        }
        .p-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--glass-border); }
        .search { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: var(--radius-sm);
                  background: rgba(0, 0, 0, 0.22); border: 1px solid var(--glass-border); }
        html[data-theme-mode=light] .search { background: rgba(255, 255, 255, 0.7); }
        .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 14px; }
        .filters { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px 2px;
                   -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent 100%);
                   mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 22px), transparent 100%); }
        .filters::-webkit-scrollbar { display: none; }
        .filters button { flex: 0 0 auto; white-space: nowrap; }
        .filters button {
            padding: 5px 11px; border-radius: 999px; border: 1px solid var(--glass-border); background: none; cursor: pointer;
            color: var(--text-dim); font: inherit; font-size: 12px; font-weight: 650;
        }
        .filters button.active { color: var(--text); background: rgba(var(--accent-rgb), 0.18); border-color: rgba(var(--accent-rgb), 0.5); }
        .filters button .n { opacity: 0.7; font-weight: 500; margin-left: 3px; }
        .p-tabs { display: flex; gap: 4px; padding: 8px 12px 0; }
        .p-tabs button { flex: 1; padding: 7px 8px; border-radius: 10px 10px 0 0; border: 1px solid transparent; border-bottom: 0;
                         background: none; color: var(--text-dim); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
        .p-tabs button.active { color: var(--text); background: rgba(var(--accent-rgb), 0.12); border-color: var(--glass-border); }
        .p-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
        .st-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(127, 127, 127, 0.12); }
        .st-row:hover, .st-row.sel { background: rgba(var(--accent-rgb), 0.1); }
        .st-main { flex: 1; min-width: 0; }
        .st-call { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
        .st-com { font-size: 12px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .st-age { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
        .tag { font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 999px; text-transform: uppercase;
               border: 1px solid var(--glass-border); color: var(--text-dim); }
        .tag.dmr { color: #e5b8ff; border-color: rgba(191, 90, 242, 0.6); background: rgba(191, 90, 242, 0.18); }
        .tag.rpt { color: #9bd8ff; border-color: rgba(10, 132, 255, 0.55); background: rgba(10, 132, 255, 0.16); }
        .tag.local { color: #7ef0a0; border-color: rgba(48, 209, 88, 0.5); background: rgba(48, 209, 88, 0.14); }
        .tag.aprsis { color: var(--text-dim); }
        html[data-theme-mode=light] .tag.dmr { color: #7a2fb0; } html[data-theme-mode=light] .tag.rpt { color: #0a5fc0; }
        html[data-theme-mode=light] .tag.local { color: #15803d; }
        .empty { padding: 28px 16px; text-align: center; color: var(--text-dim); font-size: 13px; line-height: 1.5; }
        .pk-row { padding: 6px 12px; border-bottom: 1px solid rgba(127, 127, 127, 0.12); font-family: ui-monospace, "SF Mono", Menlo, monospace;
                  font-size: 11.5px; line-height: 1.45; word-break: break-all; cursor: pointer; }
        .pk-row:hover { background: rgba(var(--accent-rgb), 0.08); }
        .pk-row .t { color: var(--text-dim); margin-right: 6px; }
        .pk-row .s { color: var(--accent); font-weight: 700; }
        .pk-row.o-daprs .s { color: #d69bff; } .pk-row.o-server .s { color: #7fb8ff; } .pk-row.o-client .s { color: #7ef0a0; }
        .p-foot { padding: 8px 12px; border-top: 1px solid var(--glass-border); font-size: 11.5px; color: var(--text-dim); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .p-foot code { font-family: ui-monospace, Menlo, monospace; color: var(--text); }
        .legend { display: flex; gap: 10px; flex-wrap: wrap; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

        /* ---- symbols & markers ---- */
        .sym { width: 24px; height: 24px; flex: 0 0 24px; position: relative; background-repeat: no-repeat; background-size: 384px 144px; }
        .sym .ov { position: absolute; inset: 0; background-repeat: no-repeat; background-size: 384px 144px; }
        .mk { position: relative; display: flex; align-items: center; gap: 4px; }
        .mk .lbl { font-size: 11px; font-weight: 700; white-space: nowrap; padding: 1px 6px; border-radius: 999px;
                   background: rgba(10, 14, 28, 0.72); color: #f5f7fb; border: 1px solid rgba(255, 255, 255, 0.15); pointer-events: none; }
        html[data-theme-mode=light] .mk .lbl { background: rgba(255, 255, 255, 0.85); color: #152235; border-color: rgba(20, 30, 60, 0.15); }
        .mk.dmr .sym { filter: drop-shadow(0 0 4px rgba(191, 90, 242, 0.95)); }
        .mk.dmr .lbl { border-color: rgba(191, 90, 242, 0.7); }
        .mk.rpt .lbl { border-color: rgba(10, 132, 255, 0.6); }
        .mk.dead { opacity: 0.4; }
        .mk.fresh .sym::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0;
                                animation: ping 1.6s ease-out 2 forwards; }
        @keyframes ping { from { transform: scale(0.6); opacity: 1; } to { transform: scale(1.8); opacity: 0; } }
        .map-nolabels .mk .lbl { display: none; }
        /* dark map: OpenStreetMap tiles turned dark, tinted towards the N8 night blue */
        .tiles-dark .leaflet-tile-pane { filter: invert(1) hue-rotate(185deg) brightness(0.92) contrast(0.88) saturate(0.55); }
        .leaflet-div-icon.aprs-ic { background: none; border: 0; }

        /* ---- popup ---- */
        .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border-radius: var(--radius-md);
                                         border: 1px solid var(--glass-border); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
                                         box-shadow: var(--glass-shadow); }
        .leaflet-popup-tip { background: var(--panel); }
        .leaflet-popup-content { margin: 12px 14px; min-width: 240px; font-size: 13px; line-height: 1.45; }
        .leaflet-container a.leaflet-popup-close-button { color: var(--text-dim); }
        .pp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .pp-head .av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(191, 90, 242, 0.7); }
        .pp-call { font-size: 16px; font-weight: 800; }
        .pp-call a { color: inherit; text-decoration: none; }
        .pp-name { font-size: 12px; color: var(--text-dim); }
        .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
        .kv span:nth-child(odd) { color: var(--text-dim); white-space: nowrap; }
        .kv span:nth-child(even) { overflow-wrap: anywhere; }
        .pp-com { margin: 8px 0 2px; padding: 6px 9px; border-radius: 9px; background: rgba(127, 127, 127, 0.12); font-size: 12.5px; overflow-wrap: anywhere; }
        .pp-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .btn { padding: 5px 11px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
               border: 1px solid var(--glass-border); background: rgba(127, 127, 127, 0.14); color: var(--text); text-decoration: none; }
        .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0b1224; border: none; }
        .wx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
        .wx div { background: rgba(127, 127, 127, 0.12); border-radius: 9px; padding: 5px 7px; text-align: center; }
        .wx b { display: block; font-size: 14px; color: var(--accent); } .wx small { font-size: 10.5px; color: var(--text-dim); }
        .pp-pk { margin-top: 8px; max-height: 120px; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
                 background: rgba(0, 0, 0, 0.2); border-radius: 8px; padding: 6px 8px; line-height: 1.4; word-break: break-all; }
        html[data-theme-mode=light] .pp-pk { background: rgba(0, 0, 0, 0.05); }

        /* ---- leaflet controls in glass ---- */
        .leaflet-control-zoom a, .leaflet-bar a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--glass-border) !important;
                                                  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
        .leaflet-bar { border: 1px solid var(--glass-border) !important; border-radius: 12px !important; overflow: hidden; box-shadow: var(--glass-shadow) !important; }
        .leaflet-control-attribution { background: rgba(10, 14, 28, 0.6) !important; color: rgba(235, 240, 250, 0.7) !important; border-radius: 8px 0 0 0; font-size: 10.5px; }
        .leaflet-control-attribution a { color: var(--accent) !important; }
        html[data-theme-mode=light] .leaflet-control-attribution { background: rgba(255, 255, 255, 0.75) !important; color: #334 !important; }
        .leaflet-top.leaflet-right { top: calc(var(--below-head, 112px) - 10px); }
        .ctl-btn { width: 34px; height: 34px; display: flex !important; align-items: center; justify-content: center; font-size: 16px; text-decoration: none; }

        /* ---- footer / overlays ---- */
        #toast { position: fixed; z-index: 1100; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 13px; display: none; }
        #gate { position: fixed; inset: 0; z-index: 1200; display: none; align-items: center; justify-content: center; padding: 20px; }
        #gate .card { max-width: 380px; padding: 26px 24px; border-radius: var(--radius-lg); text-align: center; display: flex; flex-direction: column; gap: 12px; }
        #panelToggle { display: none; }
        .p-grab { display: none; }
        .p-foot a { color: var(--accent); text-decoration: none; }

        /* ---- embedded in the dashboard (iframe) ---- */
        body.embed header, body.embed .status-strip { display: none; }
        body.embed #panel { top: 10px; bottom: 10px; left: 10px; }
        body.embed .leaflet-top.leaflet-right { top: 0; }

        /* ---- mobile: panel becomes a bottom sheet ---- */
        @media (max-width: 760px) {
            header { top: 8px; left: 8px; right: 8px; padding: 6px 10px; gap: 8px; }
            .logo { height: 34px; } h1 { font-size: 17px; } .sub { font-size: 11px; max-width: 46vw; }
            .chips .hide-m { display: none; }
            .chip { padding: 5px 9px; font-size: 11.5px; }
            .status-strip { left: 22px; right: 22px; height: 20px; font-size: 10.5px; gap: 12px; padding: 0 10px; }
            .menu .mi { padding: 6px 10px; }
            .menu .hide-m { display: none; }
            #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 50vh; transition: height 0.25s ease; }
            #panel.min { height: 54px; }
            #panel.min .p-head, #panel.min .p-tabs, #panel.min .p-body, #panel.min .p-foot { display: none; }
            .p-grab { display: flex; align-items: center; gap: 10px; position: relative; width: 100%; padding: 18px 16px 10px; border: 0;
                      background: none; color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; }
            .p-grab .bar { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 40px; height: 5px; border-radius: 3px;
                           background: rgba(127, 127, 127, 0.55); }
            .p-grab .sum b { color: var(--accent); }
            .p-grab .chev { margin-left: auto; color: var(--text-dim); transition: transform 0.2s; transform: rotate(180deg); }
            #panel.min .p-grab .chev { transform: none; }
            #panel:not(.min) .p-grab { padding-bottom: 4px; }
            .leaflet-control-attribution { font-size: 9px; max-width: calc(100vw - 20px); }
            #panelToggle { display: inline-flex; }
            body.embed #panel { left: 6px; right: 6px; bottom: 6px; top: auto; }
            .leaflet-top.leaflet-right { top: calc(var(--below-head, 90px) - 10px); }
            .leaflet-bottom.leaflet-right { bottom: calc(50vh + 10px); }
            body.panel-min .leaflet-bottom.leaflet-right { bottom: 64px; }
        }
    </style>
</head>
<body>
<div id="map"></div>

<header class="glass">
    <a class="brand" id="brand" href="/aprs">
        <img class="logo" id="logo" src="/static/n8schicht-aprs-logo.svg" alt="">
        <div style="min-width:0"><h1 id="title">APRS</h1><div class="sub" id="subtitle">APRS map</div></div>
    </a>
    <nav class="menu">
        <span class="mi active">🗺️ <span class="hide-m">APRS map</span></span>
        <a class="mi" id="dashLink" href="/">📊 <span class="hide-m">Dashboard</span></a>
    </nav>
</header>
<!-- Status of the services: one slim line under the menu -->
<div class="status-strip" id="statusStrip">
    <span class="ss warn" id="liveChip" title="Live connection to the server"><span>Connecting</span></span>
    <span class="ss ok" id="isChip" title="Connection to the APRS network"><span class="netname">APRS-IS</span></span>
    <span class="ss-sep"></span>
    <span class="ss-n" title="Stations on the map">📍 <b id="cntStations">0</b> stations</span>
    <span class="ss-n" id="dmrChip" title="Stations with a position from a DMR radio">📻 <b id="cntDmr">0</b> DMR</span>
</div>

<aside id="panel" class="glass">
    <button class="p-grab" type="button" onclick="togglePanel()" aria-label="Show or hide the station list">
        <span class="bar"></span>
        <span class="sum">📍 <b id="grabStations">0</b> stations · 📻 <b id="grabDmr">0</b> DMR</span>
        <span class="chev">▴</span>
    </button>
    <div class="p-head">
        <label class="search">🔎 <input id="q" type="search" placeholder="Callsign, DMR ID or comment" autocomplete="off" spellcheck="false"></label>
        <div class="filters" id="filters">
            <button data-f="all" class="active">All<span class="n" id="nAll"></span></button>
            <button data-f="dmr">📻 DMR<span class="n" id="nDmr"></span></button>
            <button data-f="rpt">📡 Repeaters<span class="n" id="nRpt"></span></button>
            <button data-f="local">🖥️ Clients<span class="n" id="nLocal"></span></button>
            <button data-f="aprsis">🌍 <span class="netname">APRS-IS</span><span class="n" id="nIs"></span></button>
            <button data-f="wx">🌦️ Weather<span class="n" id="nWx"></span></button>
        </div>
    </div>
    <div class="p-tabs" id="pTabs">
        <button data-t="stations" class="active">📍 Stations</button>
        <button data-t="packets" id="tabPackets">📜 Live packets</button>
    </div>
    <div class="p-body" id="pBody"></div>
    <div class="p-foot" id="pFoot">
        <div class="legend"><span><i style="background:#bf5af2"></i>DMR</span><span><i style="background:#0a84ff"></i>Repeater</span>
            <span><i style="background:#30d158"></i>Client</span><span><i style="background:#8e8e93"></i><span class="netname">APRS-IS</span></span></div>
        <span id="connectInfo" style="margin-left:auto"></span>
        <span style="width:100%;font-size:10.5px">Symbols <a href="https://github.com/hessu/aprs-symbols" target="_blank" rel="noopener">hessu/aprs-symbols</a></span>
    </div>
</aside>

<div id="gate"><div class="card glass">
    <img src="/static/n8schicht-aprs-logo.svg" alt="" style="width:64px;height:64px;margin:0 auto" id="gateLogo">
    <h2 style="font-size:19px">🔐 Please log in</h2>
    <p style="color:var(--text-dim);font-size:13.5px">The APRS map of this server is only visible to logged-in users.</p>
    <a class="btn primary" id="gateLink" href="/" style="padding:10px 14px;font-size:14px">Log in on the dashboard</a>
</div></div>
<div id="toast" class="glass"></div>

<script>
'use strict';
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.body.classList.add('embed');

const S = { cfg: null, stations: new Map(), markers: new Map(), filter: 'all', query: '', tab: 'stations',
            packets: [], selected: null, track: null, ws: null, wsTries: 0, renderQueued: false, map: null };

// ----------------------------------------------------------------- helpers
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const now = () => Date.now() / 1000;
function ago(ts) {
    const d = Math.max(0, now() - ts);
    if (d < 60) return `${Math.round(d)} s`;
    if (d < 3600) return `${Math.round(d / 60)} min`;
    if (d < 86400) return `${Math.floor(d / 3600)} h ${Math.round((d % 3600) / 60)} min`;
    return `${Math.round(d / 86400)} d`;
}
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function locator(lat, lon) {
    const A = 'ABCDEFGHIJKLMNOPQRSTUVWX';
    let x = lon + 180, y = lat + 90;
    const f1 = A[Math.floor(x / 20)] + A[Math.floor(y / 10)];
    x %= 20; y %= 10;
    const f2 = Math.floor(x / 2) + '' + Math.floor(y);
    x = (x % 2) * 12; y = (y % 1) * 24;
    return f1 + f2 + A[Math.floor(x)].toLowerCase() + A[Math.floor(y)].toLowerCase();
}
function fmtPos(lat, lon) {
    const h = (v, p, n) => `${Math.abs(v).toFixed(5)}° ${v >= 0 ? p : n}`;
    return `${h(lat, 'N', 'S')}, ${h(lon, 'E', 'W')}`;
}
async function getJSON(url) {
    const r = await fetch(url, { credentials: 'same-origin' });
    if (!r.ok) { const e = new Error((await r.json().catch(() => ({}))).error || r.statusText); e.status = r.status; throw e; }
    return r.json();
}
function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 2600);
}

// APRS symbol → sprite position (hessu/aprs-symbols, 16 × 6 per sheet)
function symHtml(sym) {
    sym = sym && sym.length === 2 ? sym : '//';
    const table = sym[0], code = sym[1];
    const pos = ch => { const i = ch.charCodeAt(0) - 33; return i < 0 || i > 95 ? '0 0' : `-${(i % 16) * 24}px -${Math.floor(i / 16) * 24}px`; };
    const sheet = table === '/' ? 0 : 1;
    let ov = '';
    if (table !== '/' && table !== '\\' && /[0-9A-Z]/.test(table))
        ov = `<span class="ov" style="background-image:url(/static/aprs-symbols/aprs-symbols-24-2@2x.png);background-position:${pos(table)}"></span>`;
    return `<span class="sym" style="background-image:url(/static/aprs-symbols/aprs-symbols-24-${sheet}@2x.png);background-position:${pos(code)}">${ov}</span>`;
}
const SRC_LABEL = { dmr: 'DMR', rpt: 'Repeater', local: 'Client', aprsis: 'APRS-IS' };
function srcTag(s) {
    if (s.source === 'rpt') return `<span class="tag rpt">${s.rpt_type === 'hotspot' ? 'Hotspot' : 'Repeater'}</span>`;
    return `<span class="tag ${esc(s.source)}">${esc(SRC_LABEL[s.source] || s.source || '')}</span>`;
}
function matchesFilter(s) {
    const f = S.filter;
    if (f === 'wx' && !(s.kind === 'weather' || s.wx)) return false;
    if (!['all', 'wx'].includes(f) && s.source !== f) return false;
    if (!S.query) return true;
    const q = S.query;
    return s.call.toLowerCase().includes(q) || String(s.dmr_id || '').includes(q) || (s.comment || '').toLowerCase().includes(q)
        || (s.dmr_name || '').toLowerCase().includes(q) || (s.via || '').toLowerCase().includes(q);
}

// ----------------------------------------------------------------- map
function initMap() {
    const c = S.cfg.map;
    // the tile servers stop at different zoom levels (OpenTopoMap 17, OpenStreetMap 19): beyond that the last tiles are
    // enlarged (maxNativeZoom) instead of leaving the map empty and dark
    const nativeZoom = c.native_zoom || 18, maxZoom = c.max_zoom || 20;
    const map = L.map('map', { zoomControl: false, worldCopyJump: true, preferCanvas: false, maxZoom })
        .setView(c.center, c.zoom);
    L.control.zoom({ position: 'topright' }).addTo(map);
    const dark = c.dark === 'dark' || (c.dark === 'auto' && document.documentElement.dataset.themeMode !== 'light');
    document.getElementById('map').classList.toggle('tiles-dark', dark);
    L.tileLayer(c.tiles, { maxZoom, maxNativeZoom: nativeZoom, subdomains: 'abc', crossOrigin: true,
        referrerPolicy: 'strict-origin-when-cross-origin',
        attribution: c.attribution }).addTo(map);
    map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
    const Locate = L.Control.extend({ options: { position: 'topright' }, onAdd() {
        const d = L.DomUtil.create('div', 'leaflet-bar');
        d.innerHTML = '<a href="#" class="ctl-btn" title="Show all stations">🧭</a>';
        L.DomEvent.on(d, 'click', e => { L.DomEvent.stop(e); fitAll(); });
        return d; } });
    new Locate().addTo(map);
    map.on('zoomend', () => document.getElementById('map').classList.toggle('map-nolabels', map.getZoom() < 8));
    document.getElementById('map').classList.toggle('map-nolabels', map.getZoom() < 8);
    map.on('click', () => clearTrack());
    S.map = map;
}

function markerHtml(s) {
    const cls = ['mk', s.source === 'dmr' ? 'dmr' : '', s.source === 'rpt' ? 'rpt' : '', s.alive === false ? 'dead' : '', s._fresh ? 'fresh' : ''].join(' ');
    return `<div class="${cls}">${symHtml(s.symbol)}<span class="lbl">${esc(s.call)}</span></div>`;
}
function upsertMarker(s) {
    if (s.lat == null) return;
    const vis = matchesFilter(s);
    let m = S.markers.get(s.call);
    if (!vis) { if (m) { m.remove(); S.markers.delete(s.call); } return; }
    const icon = L.divIcon({ className: 'aprs-ic', html: markerHtml(s), iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -12] });
    if (!m) {
        m = L.marker([s.lat, s.lon], { icon, riseOnHover: true, zIndexOffset: s.source === 'dmr' ? 500 : 0 })
            .addTo(S.map).on('click', () => select(s.call, false));
        S.markers.set(s.call, m);
    } else {
        m.setLatLng([s.lat, s.lon]); m.setIcon(icon);
        if (m.isPopupOpen()) m.setPopupContent(popupHtml(S.stations.get(s.call)));
    }
}
function refreshMarkers() {
    for (const s of S.stations.values()) upsertMarker(s);
}
function fitAll() {
    const pts = [...S.stations.values()].filter(s => s.lat != null && matchesFilter(s)).map(s => [s.lat, s.lon]);
    if (pts.length) S.map.fitBounds(pts, { padding: [60, 60], maxZoom: 12 });
}

function popupHtml(s, extra) {
    if (!s) return '';
    const rows = [];
    rows.push(['Last heard', `${ago(s.ts)} ago · ${clock(s.ts)}`]);
    rows.push(['Position', `${fmtPos(s.lat, s.lon)}<br><small style="color:var(--text-dim)">Locator ${locator(s.lat, s.lon)}</small>`]);
    if (s.speed != null || s.course != null) rows.push(['Moving', `${s.speed != null ? Math.round(s.speed) + ' km/h' : ''} ${s.course != null ? '· ' + s.course + '°' : ''}`]);
    if (s.alt != null) rows.push(['Altitude', `${Math.round(s.alt)} m`]);
    if (s.source === 'dmr') {
        if (s.dmr_id) rows.push(['DMR ID', s.dmr_id]);
        if (s.tg) rows.push(['Talkgroup', s.tg]);
        if (s.via) rows.push(['Via', esc(s.via)]);
        if (s.gps) rows.push(['GPS', { embedded: 'in the voice call', nmea: 'data call (NMEA)', lrrp: 'data call (LRRP)' }[s.gps] || esc(s.gps)]);
    }
    if (s.source === 'rpt' && s.freq) rows.push(['Frequency', esc(s.freq)]);
    if (s.kind === 'object' || s.kind === 'item') rows.push([s.kind === 'object' ? 'Object of' : 'Item of', esc(s.owner || '')]);
    if (s.status) rows.push(['Status', esc(s.status)]);
    rows.push(['Source', srcTag(s)]);
    if (s.path && S.cfg.map.show_packets) rows.push(['Path', `<small>${esc(s.path)}</small>`]);
    const wx = s.wx ? Object.entries({ temp_c: ['°C', 'Temp'], humidity: ['%', 'Humidity'], pressure_hpa: ['hPa', 'Pressure'],
        wind_kmh: ['km/h', 'Wind'], gust_kmh: ['km/h', 'Gust'], rain_1h_mm: ['mm', 'Rain 1h'] })
        .filter(([k]) => s.wx[k] != null).map(([k, [u, l]]) => `<div><b>${s.wx[k]}${u === '°C' || u === '%' ? u : ''}</b><small>${l}${u !== '°C' && u !== '%' ? ' ' + u : ''}</small></div>`).join('') : '';
    const av = s.dmr_id ? `<img class="av" src="/api/avatar/${s.dmr_id}" alt="" onerror="this.remove()">` : '';
    const pk = extra && extra.packets && extra.packets.length ? `<div class="pp-pk">${extra.packets.slice(0, 8).map(p =>
        `<div><span style="color:var(--text-dim)">${clock(p.ts)}</span> ${esc(p.raw)}</div>`).join('')}</div>` : '';
    return `<div class="pp-head">${av || symHtml(s.symbol)}<div><div class="pp-call">
            <a href="https://aprs.fi/#!call=a%2F${encodeURIComponent(s.call)}" target="_blank" rel="noopener">${esc(s.call)}</a> ${s.source === 'dmr' ? '<span class="tag dmr">DMR</span>' : ''}</div>
            ${s.dmr_name ? `<div class="pp-name">${esc(s.dmr_name)}</div>` : ''}</div></div>
        <div class="kv">${rows.map(([k, v]) => `<span>${k}</span><span>${v}</span>`).join('')}</div>
        ${s.comment ? `<div class="pp-com">${esc(s.comment)}</div>` : ''}
        ${wx ? `<div class="wx">${wx}</div>` : ''}
        ${pk}
        <div class="pp-actions">
            ${S.cfg.map.tracks ? `<button class="btn" onclick="showTrack('${esc(s.call)}')">〰️ Track</button>` : ''}
            <a class="btn" href="https://aprs.fi/#!call=a%2F${encodeURIComponent(s.call)}" target="_blank" rel="noopener">aprs.fi ↗</a>
        </div>`;
}

async function select(call, pan = true) {
    const s = S.stations.get(call); if (!s) return;
    S.selected = call;
    let m = S.markers.get(call);
    if (!m) { S.filter = 'all'; S.query = ''; document.getElementById('q').value = ''; setFilterButtons(); refreshMarkers(); m = S.markers.get(call); }
    if (!m) return;
    if (pan) S.map.setView([s.lat, s.lon], Math.max(S.map.getZoom(), 11));
    m.bindPopup(popupHtml(s), { maxWidth: 340, autoPanPaddingTopLeft: [EMBED ? 20 : 380, 90] }).openPopup();
    renderList();
    try {
        const d = await getJSON(`/api/aprs/station/${encodeURIComponent(call)}`);
        Object.assign(s, d.station);
        if (m.isPopupOpen()) m.setPopupContent(popupHtml(s, d));
        if (S.cfg.map.tracks && d.track && d.track.length > 1) drawTrack(d.track);
    } catch (e) { /* station gone */ }
}
function clearTrack() { if (S.track) { S.track.remove(); S.track = null; } }
function drawTrack(pts) {
    clearTrack();
    S.track = L.polyline(pts.map(p => [p[1], p[2]]), { color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5ac8fa',
                                                      weight: 3, opacity: 0.85, dashArray: '6 6' }).addTo(S.map);
}
async function showTrack(call) {
    try {
        const d = await getJSON(`/api/aprs/station/${encodeURIComponent(call)}`);
        if (!d.track || d.track.length < 2) { toast('No track: the station has not moved'); return; }
        drawTrack(d.track); S.map.fitBounds(S.track.getBounds(), { padding: [80, 80] });
    } catch (e) { toast(e.message); }
}

// ----------------------------------------------------------------- panel
function counts() {
    const c = { all: 0, dmr: 0, rpt: 0, local: 0, aprsis: 0, wx: 0 };
    for (const s of S.stations.values()) {
        if (s.lat == null) continue;
        c.all++; c[s.source] = (c[s.source] || 0) + 1;
        if (s.kind === 'weather' || s.wx) c.wx++;
    }
    return c;
}
function setFilterButtons() {
    document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b.dataset.f === S.filter));
}
function renderList() {
    S.renderQueued = false;
    const c = counts();
    const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v ? ` ${v}` : ''; };
    set('nAll', c.all); set('nDmr', c.dmr); set('nRpt', c.rpt); set('nLocal', c.local); set('nIs', c.aprsis); set('nWx', c.wx);
    document.getElementById('cntStations').textContent = c.all;
    document.getElementById('cntDmr').textContent = c.dmr;
    document.getElementById('grabStations').textContent = c.all;
    document.getElementById('grabDmr').textContent = c.dmr;
    const body = document.getElementById('pBody');
    if (S.tab === 'packets') { renderPackets(body); return; }
    const list = [...S.stations.values()].filter(s => s.lat != null && matchesFilter(s)).sort((a, b) => b.ts - a.ts).slice(0, 400);
    if (!list.length) {
        body.innerHTML = `<div class="empty">${S.stations.size ? 'No station matches.' :
            '📡 No stations yet.<br>DMR radios with GPS, repeaters and APRS clients appear here as soon as they report a position.'}</div>`;
        return;
    }
    body.innerHTML = list.map(s => `<div class="st-row ${s.call === S.selected ? 'sel' : ''}" data-call="${esc(s.call)}">
            ${symHtml(s.symbol)}
            <div class="st-main"><div class="st-call">${esc(s.call)} ${srcTag(s)}</div>
                <div class="st-com">${esc(s.source === 'dmr' ? [s.dmr_name, s.tg ? 'TG ' + s.tg : '', s.via ? 'via ' + s.via : ''].filter(Boolean).join(' · ') || s.comment : (s.comment || s.status || ''))}</div></div>
            <div class="st-age">${ago(s.ts)}${s.speed ? `<br>${Math.round(s.speed)} km/h` : ''}</div></div>`).join('');
}
function renderPackets(body) {
    if (!S.packets.length) { body.innerHTML = '<div class="empty">Waiting for packets …</div>'; return; }
    const q = S.query;
    const list = S.packets.filter(p => !q || p.raw.toLowerCase().includes(q)).slice(0, 200);
    body.innerHTML = list.map(p => `<div class="pk-row o-${esc(p.origin)}" data-call="${esc(p.call)}"><span class="t">${clock(p.ts)}</span>${esc(p.raw).replace(/^([^&]*?)&gt;/, '<span class="s">$1</span>&gt;')}</div>`).join('');
}
function queueRender() { if (!S.renderQueued) { S.renderQueued = true; setTimeout(renderList, 700); } }
function togglePanel() {
    const p = document.getElementById('panel'); p.classList.toggle('min');
    document.body.classList.toggle('panel-min', p.classList.contains('min'));
}

// ----------------------------------------------------------------- live
function setLive(state) {
    const el = document.getElementById('liveChip');
    el.className = 'ss ' + (state === 'live' ? 'ok' : state === 'off' ? 'off' : 'warn');
    el.querySelector('span:last-child').textContent = state === 'live' ? 'Live' : state === 'off' ? 'Offline' : 'Connecting';
}
function connectWs() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/aprs/ws`);
    S.ws = ws;
    ws.onopen = () => { S.wsTries = 0; setLive('live'); };
    ws.onclose = () => { setLive(S.wsTries > 2 ? 'off' : 'connecting'); S.wsTries++;
                         setTimeout(() => { loadStations(); connectWs(); }, Math.min(30000, 1500 * S.wsTries)); };
    ws.onmessage = ev => {
        if (ev.data === 'pong') return;
        const msg = JSON.parse(ev.data);
        if (msg.type !== 'batch') return;
        for (const it of msg.items) {
            if (it.type === 'station') {
                const s = it.station, old = S.stations.get(s.call);
                const moved = !old || old.lat !== s.lat || old.lon !== s.lon;
                s._fresh = moved;
                S.stations.set(s.call, Object.assign(old || {}, s));
                upsertMarker(S.stations.get(s.call));
                if (moved) setTimeout(() => { const st = S.stations.get(s.call); if (st) { st._fresh = false; upsertMarker(st); } }, 3500);
            } else if (it.type === 'packet') {
                S.packets.unshift(it.packet); if (S.packets.length > 300) S.packets.length = 300;
            }
        }
        queueRender();
    };
}
setInterval(() => { if (S.ws && S.ws.readyState === 1) S.ws.send('ping'); }, 25000);
setInterval(queueRender, 30000);          // "x min ago"

async function loadStations() {
    try {
        const d = await getJSON('/api/aprs/stations');
        const seen = new Set();
        for (const s of d.stations) { seen.add(s.call); S.stations.set(s.call, Object.assign(S.stations.get(s.call) || {}, s)); }
        for (const call of [...S.stations.keys()]) if (!seen.has(call)) { S.stations.delete(call); const m = S.markers.get(call); if (m) { m.remove(); S.markers.delete(call); } }
        refreshMarkers(); renderList();
    } catch (e) { if (e.status === 401) showGate(); }
}
async function loadPackets() {
    if (!S.cfg.map.show_packets) return;
    try { S.packets = (await getJSON('/api/aprs/packets?limit=200')).packets; } catch (e) { }
}
async function loadStatus() {
    try {
        const st = await getJSON('/api/aprs/status');
        const chip = document.getElementById('isChip');
        const on = st.uplink && st.uplink.state === 'connected' && st.uplink.verified;
        chip.className = 'ss ' + (on ? 'ok' : st.uplink && st.uplink.state === 'off' ? '' : 'warn');
        chip.title = on ? `Connected to ${SRC_LABEL.aprsis}` : `Not connected to ${SRC_LABEL.aprsis} (local map only)`;
        chip.style.display = st.uplink && st.uplink.state === 'off' ? 'none' : '';
    } catch (e) { }
}
function showGate() {
    document.getElementById('gate').style.display = 'flex';
    document.getElementById('panel').style.display = 'none';
}

// ----------------------------------------------------------------- start
async function start() {
    try { S.cfg = await getJSON('/api/aprs/config'); }
    catch (e) { document.body.innerHTML = `<div class="empty" style="padding:60px">${esc(e.message)}</div>`; return; }
    const c = S.cfg;
    try { N8Theme.apply(c.theme || {}); } catch (e) { }
    document.documentElement.style.setProperty('--logo-size', `${Math.max(24, Math.min(96, Number(c.logo_size || 44)))}px`);
    document.documentElement.style.setProperty('--logo-radius', `${Math.max(0, Math.min(50, Number(c.logo_radius || 0)))}%`);
    const logo = c.site.logo || '/static/n8schicht-aprs-logo.svg';
    document.getElementById('logo').src = logo; document.getElementById('gateLogo').src = logo;
    document.getElementById('favicon').href = c.site.logo || '/static/n8schicht-aprs-icon.svg';
    document.getElementById('title').textContent = c.site.title;
    document.getElementById('subtitle').textContent = c.site.subtitle;
    document.title = `${c.site.title} · APRS`;
    document.getElementById('dashLink').href = c.dashboard_url;
    document.getElementById('gateLink').href = c.dashboard_url;
    if (!c.map.show_packets) document.getElementById('tabPackets').style.display = 'none';
    SRC_LABEL.aprsis = c.network || 'APRS-IS';
    document.querySelectorAll('.netname').forEach(e => e.textContent = SRC_LABEL.aprsis);
    if (c.map.sources !== 'all') document.querySelector('#filters [data-f=aprsis]').style.display = 'none';
    if (c.server.ports.length) document.getElementById('connectInfo').innerHTML =
        `APRS-IS: <code>${esc(c.server.host)}:${c.server.ports[0]}</code>`;
    if (!c.allowed) { showGate(); return; }
    initMap();
    document.getElementById('filters').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        S.filter = b.dataset.f; setFilterButtons(); refreshMarkers(); renderList();
    });
    document.getElementById('pTabs').addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        S.tab = b.dataset.t; document.querySelectorAll('#pTabs button').forEach(x => x.classList.toggle('active', x === b)); renderList();
    });
    document.getElementById('q').addEventListener('input', e => { S.query = e.target.value.trim().toLowerCase(); refreshMarkers(); renderList(); });
    document.getElementById('pBody').addEventListener('click', e => {
        const r = e.target.closest('[data-call]'); if (r) select(r.dataset.call);
    });
    await Promise.all([loadStations(), loadPackets(), loadStatus()]);
    renderList();
    connectWs();
    setInterval(loadStatus, 60000);
    setInterval(loadStations, 5 * 60000);   // drops stations that got too old
    const sel = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    if (sel && S.stations.has(sel)) select(sel);
    else if (window.matchMedia('(max-width: 760px)').matches) togglePanel();
}
// the status strip hangs directly under the header, whatever height the header has
function placeStrip() {
    const h = document.querySelector('header'), st = document.getElementById('statusStrip');
    if (!h || !st || EMBED) return;
    const b = h.getBoundingClientRect().bottom;
    st.style.top = (b - 1) + 'px';
    document.documentElement.style.setProperty('--below-head', (b + 22 + 8) + 'px');
}
window.addEventListener('resize', placeStrip);
placeStrip(); setTimeout(placeStrip, 300);
start();
</script>
<script>
    // N8 Kit: DE | EN at the end of the menu (not in the embedded view of the dashboard)
    if (window.self === window.top) N8Kit.langSwitch(document.querySelector('header .menu'));
</script>
</body>
</html>
